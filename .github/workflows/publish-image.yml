name: Build and publish Docker image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-codevista-publish
  cancel-in-progress: false

jobs:
  publish:
    # Only reviewed master builds may update the public latest image.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE: iamseyedalipro/codevista
    steps:
      - name: Checkout the selected commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Verify before publishing
        run: |
          npm ci
          npm run check
          node .codevista/tools/validate.mjs .codevista
      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build a local image for the container smoke test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: codevista:smoke
          cache-from: type=gha,scope=codevista
      - name: Verify container runtime and Compose configuration
        run: |
          bash scripts/test-container.sh codevista:smoke
          DOMAIN=codevista.duckdns.org LETSENCRYPT_EMAIL=ci@example.com SESSION_ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= docker compose config --quiet
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: iamseyedalipro
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push both architectures
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:build-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/iamseyedalipro/CodeVista
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=codevista
          cache-to: type=gha,mode=max,scope=codevista
          provenance: mode=max
          sbom: true
      - name: Record exact deployment image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '### Published image\n\n`%s@%s`\n\nSet `CODEVISTA_IMAGE` to this value on the server. No server deployment was performed.\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
